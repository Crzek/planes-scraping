services:
  vuelos-app:
    build:
      context: . # Path: docker/
      dockerfile: Dockerfile
    image: planes-scraping:1.0-pw-prod # Name of the image
    container_name: prod-planes-pw
    restart: unless-stopped
    # entrypoint.sh: aplica migraciones (flask db upgrade) y arranca gunicorn
    entrypoint: ["/app/entrypoint.sh"]
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1 # para mostrar los logs en tiempo real
      - FLASK_APP=main:app # necesario para `flask db upgrade`
      # CA intermedia descargada en el build (ver Dockerfile); tiene prioridad
      # sobre un API_EXTRA_CA_FILE relativo que venga del .env
      - API_EXTRA_CA_FILE=/usr/local/share/private-radar/sectigo-dv-r36.pem
    env_file:
      - .env
    # file: entrypoint.py
    # instance the flask: app = Flask(__name__) // app = create_app()
    # gunicorn normally is use port 8000
    # command: flask --app main run --host=0.0.0.0 --port=5000

    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:${PORT:-5000}/status/health'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

