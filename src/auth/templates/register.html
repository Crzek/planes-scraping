{% extends "base.html" %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}
<section class="auth">
    <h1 class="auth__title">Crear cuenta</h1>
    <form class="panel" action="{{ url_for('authBP.register') }}" method="POST">
        <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="field__input" type="email" name="email" id="email" autocomplete="username" required>
        </div>
        <div class="field">
            <label class="field__label" for="password">Contraseña</label>
            <input class="field__input" type="password" name="password" id="password" autocomplete="new-password"
                required>
        </div>
        <button class="btn btn--block" type="submit">Crear cuenta</button>
    </form>
    <p class="auth__aside">
        <a href="{{ url_for('authBP.login') }}">Iniciar sesión</a>
    </p>
</section>
{% endblock %}
