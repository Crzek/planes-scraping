{% extends "base.html" %}

{% block title %}Página no encontrada{% endblock %}

{% block content %}
<section class="notfound">
    <p class="notfound__code">404</p>
    <h1>Página no encontrada</h1>
    <p>La dirección no existe o ha cambiado. Ve a una de estas páginas:</p>
    <ul class="notfound__links">
        {% if not islogged %}
        <li><a class="btn btn--ghost" href="/login">Iniciar sesión</a></li>
        <li><a class="btn btn--ghost" href="/register">Crear cuenta</a></li>
        {% endif %}
        <li><a class="btn btn--ghost" href="/vuelos">Vuelos</a></li>
    </ul>
</section>
{% endblock %}
