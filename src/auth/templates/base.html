<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Vuelos Sabadell</title>
    <link rel="stylesheet" href="{{ url_for('authBP.static', filename='styles/styles.css') }}">
    {% block head %}{% endblock %}
</head>

<body>
    <header class="topbar">
        <a class="topbar__brand" href="/">Vuelos Sabadell</a>
        {% if current_user and current_user.is_authenticated %}
        <a class="topbar__link" href="{{ url_for('authBP.logout') }}">Cerrar sesión</a>
        {% endif %}
    </header>
    <main class="shell {% block shell_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>

</html>
