<form id="remakeForm" class="panel" action="{{ url_for('authBP.vuelos', remake='remake') }}" method="POST">
    <div class="field">
        <label class="field__label" for="day">Día</label>
        <select class="field__input" id="day" name="day">
            <option value="today">Hoy, {{ today }}</option>
            <option value="tomorrow">Mañana, {{ tomorrow }}</option>
        </select>
    </div>
    <div class="check">
        <input class="check__input" id="select_all" name="select_all" value="all" type="checkbox">
        <label for="select_all">Seleccionar todo en el filtro</label>
    </div>
    <button class="btn" type="submit" name="submit_remake">Generar vuelos</button>
</form>
